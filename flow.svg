<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#58a6ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#3fb950" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Step 1: Founder -->
  <rect x="40" y="28" width="160" height="56" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="120" y="52" text-anchor="middle" font-size="13" font-weight="600" fill="#e6edf3">Founder has an idea</text>
  <text x="120" y="70" text-anchor="middle" font-size="11" fill="#8b949e">The vision starts here</text>

  <!-- Arrow 1 -->
  <line x1="200" y1="56" x2="238" y2="56" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 2: Azhar joins -->
  <rect x="240" y="28" width="200" height="56" rx="8" fill="#0d2233" stroke="#1f6feb" stroke-width="1"/>
  <text x="340" y="52" text-anchor="middle" font-size="13" font-weight="600" fill="#58a6ff">Azhar joins the team</text>
  <text x="340" y="70" text-anchor="middle" font-size="11" fill="#5b9dd9">Full-stack · AI · Mobile</text>

  <!-- Arrow 2 -->
  <line x1="440" y1="56" x2="478" y2="56" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- Step 3: MVP Ships -->
  <rect x="480" y="28" width="160" height="56" rx="8" fill="#0d2a18" stroke="#238636" stroke-width="1"/>
  <text x="560" y="52" text-anchor="middle" font-size="13" font-weight="600" fill="#3fb950">MVP ships</text>
  <text x="560" y="70" text-anchor="middle" font-size="11" fill="#2ea043">On time · Production-ready</text>

  <!-- Divider -->
  <line x1="40" y1="112" x2="640" y2="112" stroke="#21262d" stroke-width="1"/>

  <!-- What happens label -->
  <text x="340" y="136" text-anchor="middle" font-size="11" fill="#6e7681">What happens in between</text>

  <!-- Pillar 1 -->
  <rect x="40" y="155" width="136" height="52" rx="8" fill="#1a1329" stroke="#3d2b8a" stroke-width="1"/>
  <text x="108" y="177" text-anchor="middle" font-size="12" font-weight="600" fill="#bc8cff">Architecture</text>
  <text x="108" y="195" text-anchor="middle" font-size="11" fill="#8956d4">Clean &amp; scalable</text>

  <!-- Pillar 2 -->
  <rect x="192" y="155" width="136" height="52" rx="8" fill="#1a1329" stroke="#3d2b8a" stroke-width="1"/>
  <text x="260" y="177" text-anchor="middle" font-size="12" font-weight="600" fill="#bc8cff">AI Features</text>
  <text x="260" y="195" text-anchor="middle" font-size="11" fill="#8956d4">Agents &amp; LLMs</text>

  <!-- Pillar 3 -->
  <rect x="344" y="155" width="136" height="52" rx="8" fill="#1a1329" stroke="#3d2b8a" stroke-width="1"/>
  <text x="412" y="177" text-anchor="middle" font-size="12" font-weight="600" fill="#bc8cff">APIs &amp; Backend</text>
  <text x="412" y="195" text-anchor="middle" font-size="11" fill="#8956d4">Fast &amp; reliable</text>

  <!-- Pillar 4 -->
  <rect x="496" y="155" width="144" height="52" rx="8" fill="#1a1329" stroke="#3d2b8a" stroke-width="1"/>
  <text x="568" y="177" text-anchor="middle" font-size="12" font-weight="600" fill="#bc8cff">Mobile-ready</text>
  <text x="568" y="195" text-anchor="middle" font-size="11" fill="#8956d4">Web &amp; app</text>

  <!-- Bottom tagline -->
  <text x="340" y="252" text-anchor="middle" font-size="11" fill="#484f58">From idea to production — reliably.</text>
</svg>
