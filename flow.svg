<svg width="800" height="320" viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .font-display { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 700; }
      .font-body { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 400; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="320" fill="#f2f0e8" rx="12"/>

  <!-- Section label -->
  <text x="32" y="38" class="font-display" font-size="10" fill="#b6b5b5" letter-spacing="2">&#9889;  WHAT WORKING WITH ME LOOKS LIKE</text>
  <line x1="32" y1="46" x2="768" y2="46" stroke="#e0ddd4" stroke-width="1"/>

  <!-- CARD 1: Founder -->
  <rect x="32" y="62" width="196" height="90" rx="6" fill="#ffffff" stroke="#e0ddd4" stroke-width="1"/>
  <text x="48" y="84" class="font-display" font-size="9" fill="#b6b5b5" letter-spacing="1.5">01</text>
  <text x="48" y="104" class="font-display" font-size="15" fill="#111111">Founder has</text>
  <text x="48" y="122" class="font-display" font-size="15" fill="#111111">an idea</text>
  <text x="48" y="142" class="font-body" font-size="10" fill="#838282">Vision starts here</text>

  <!-- Arrow 1 -->
  <line x1="228" y1="107" x2="256" y2="107" stroke="#c8c5bc" stroke-width="1.5" stroke-linecap="round"/>
  <polyline points="250,101 258,107 250,113" fill="none" stroke="#c8c5bc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- CARD 2: Azhar joins (active / black) -->
  <rect x="264" y="62" width="272" height="90" rx="6" fill="#111111" stroke="#111111" stroke-width="1"/>
  <text x="280" y="84" class="font-display" font-size="9" fill="#555555" letter-spacing="1.5">02</text>
  <text x="280" y="104" class="font-display" font-size="15" fill="#f2f0e8">Azhar joins</text>
  <text x="280" y="122" class="font-display" font-size="15" fill="#f2f0e8">the team</text>
  <text x="280" y="142" class="font-body" font-size="10" fill="#888888">Full-stack + AI engineering</text>

  <!-- Arrow 2 -->
  <line x1="536" y1="107" x2="564" y2="107" stroke="#c8c5bc" stroke-width="1.5" stroke-linecap="round"/>
  <polyline points="558,101 566,107 558,113" fill="none" stroke="#c8c5bc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- CARD 3: MVP Ships -->
  <rect x="572" y="62" width="196" height="90" rx="6" fill="#ffffff" stroke="#e0ddd4" stroke-width="1"/>
  <text x="588" y="84" class="font-display" font-size="9" fill="#b6b5b5" letter-spacing="1.5">03</text>
  <text x="588" y="104" class="font-display" font-size="15" fill="#111111">MVP ships</text>
  <text x="588" y="122" class="font-display" font-size="15" fill="#111111">&#10003; On time</text>
  <text x="588" y="142" class="font-body" font-size="10" fill="#838282">Production-ready</text>

  <!-- Divider -->
  <line x1="32" y1="172" x2="768" y2="172" stroke="#e0ddd4" stroke-width="1"/>

  <!-- PILLARS background -->
  <rect x="32" y="182" width="736" height="96" rx="6" fill="#ffffff" stroke="#e0ddd4" stroke-width="1"/>

  <!-- Pillar dividers -->
  <line x1="216" y1="182" x2="216" y2="278" stroke="#e0ddd4" stroke-width="1"/>
  <line x1="400" y1="182" x2="400" y2="278" stroke="#e0ddd4" stroke-width="1"/>
  <line x1="584" y1="182" x2="584" y2="278" stroke="#e0ddd4" stroke-width="1"/>

  <!-- Pillar 1 -->
  <text x="50" y="210" class="font-display" font-size="28" fill="#ede9df">01</text>
  <text x="50" y="240" class="font-display" font-size="13" fill="#111111">Architecture</text>
  <text x="50" y="258" class="font-body" font-size="10" fill="#838282">Clean &amp; scalable</text>

  <!-- Pillar 2 -->
  <text x="234" y="210" class="font-display" font-size="28" fill="#ede9df">02</text>
  <text x="234" y="240" class="font-display" font-size="13" fill="#111111">AI Features</text>
  <text x="234" y="258" class="font-body" font-size="10" fill="#838282">Agents &amp; LLMs</text>

  <!-- Pillar 3 -->
  <text x="418" y="210" class="font-display" font-size="28" fill="#ede9df">03</text>
  <text x="418" y="240" class="font-display" font-size="13" fill="#111111">APIs &amp; Backend</text>
  <text x="418" y="258" class="font-body" font-size="10" fill="#838282">Fast &amp; reliable</text>

  <!-- Pillar 4 -->
  <text x="602" y="210" class="font-display" font-size="28" fill="#ede9df">04</text>
  <text x="602" y="240" class="font-display" font-size="13" fill="#111111">Mobile-ready</text>
  <text x="602" y="258" class="font-body" font-size="10" fill="#838282">Web &amp; cross-platform</text>

  <!-- Tagline -->
  <text x="400" y="304" class="font-body" font-size="10" fill="#b6b5b5" text-anchor="middle" letter-spacing="1.5">FROM IDEA TO PRODUCTION — RELIABLY.</text>
</svg>
